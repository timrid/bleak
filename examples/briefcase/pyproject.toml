[tool.briefcase]
project_name = "Bleak-Briefcase-Example"
bundle = "com.bleak.briefcaseexample"
version = "0.0.1"
license.file = "LICENSE"

[tool.briefcase.app.bleak_example]
formal_name = "Bleak-Briefcase-Example"
description = "Example Application build with briefcase"
long_description = """More details about the app should go here.
"""
sources = [
    "src/bleak_example",
    "../../bleak"
]
test_sources = [
    "tests",
]

requires = [
    # There is an error message "Failed to create MD5 hash for file content." when declaring "../..".
    # So we just copy the bleak files (see 'sources').
]
test_requires = [
    "pytest",
    "pytest-asyncio",
    "requests",
]

[tool.briefcase.app.bleak_example.macOS]
universal_build = true
requires = [
    "toga-cocoa~=0.5.0",
    "std-nslog~=1.0.3"
   #  "../.."
]
min_os_version = "14.0"

[tool.briefcase.app.bleak_example.windows]
requires = [
    "toga-winforms~=0.5.0",
]

[tool.briefcase.app.bleak_example.android]
requires = [
    "toga-android~=0.5.0",
]

base_theme = "Theme.MaterialComponents.Light.DarkActionBar"

build_gradle_dependencies = [
    "com.google.android.material:material:1.12.0",
    # Needed for DetailedList
    "androidx.swiperefreshlayout:swiperefreshlayout:1.1.0",
    # Needed for MapView
    # "org.osmdroid:osmdroid-android:6.1.20",
]

build_gradle_extra_content = "android.defaultConfig.python.staticProxy('bleak.backends.android.chaquopy.scanner_callback', 'bleak.backends.android.chaquopy.client_callback')"
android_manifest_extra_content = """
<uses-permission android:name="android.permission.BLUETOOTH" android:maxSdkVersion="30" />
<uses-permission android:name="android.permission.BLUETOOTH_ADMIN" android:maxSdkVersion="30" />
<uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" android:maxSdkVersion="30" />
<uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" android:maxSdkVersion="30" />
<uses-permission android:name="android.permission.BLUETOOTH_SCAN" android:usesPermissionFlags="neverForLocation" />
<uses-permission android:name="android.permission.BLUETOOTH_CONNECT" />
"""
