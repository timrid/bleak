name: Build and Test Briefcase

on: workflow_dispatch

jobs:
    # See: https://briefcase.readthedocs.io/en/stable/how-to/ci.html
    test_briefcase_android:
        name: "Build Briefcase Tests (Android)"
        runs-on: ubuntu-24.04
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Python
              uses: actions/setup-python@v4
              with:
                python-version: "3.13"

            - name: Install Briefcase
              run: |
                python -m pip install -U pip setuptools wheel
                python -m pip install briefcase==0.3.23

            - name: Install dependencies
              run: pip install briefcase==0.3.23

            - name: Build bleak .whl
              run: pip wheel ../.. --no-deps
              working-directory: examples/briefcase

            - name: Setup Environment
              run: |
                # Use GitHub's preinstalled JDK 17 for Android builds
                echo JAVA_HOME="${JAVA_HOME_17_X64:-$JAVA_HOME_17_arm64}" | tee -a ${GITHUB_ENV}
                # Enable KVM permissions for the emulator
                echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
                  | sudo tee /etc/udev/rules.d/99-kvm4all.rules
                sudo udevadm control --reload-rules
                sudo udevadm trigger --name-match=kvm

            - name: Run App
              run: |
                ${{ matrix.briefcase-build-prefix }} \
                briefcase build \
                  Android \
                  Gradle \
                  --test --no-input --log \
                  --device '{"avd":"beePhone"}' \
                  --shutdown-on-exit \
                  --Xemulator=-no-window \
                  --Xemulator=-no-snapshot \
                  --Xemulator=-no-audio \
                  --Xemulator=-no-boot-anim \

                  ${{ matrix.briefcase-args }} \
                  ${{ matrix.briefcase-build-args }}
