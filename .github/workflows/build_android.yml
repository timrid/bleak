name: Build and Test Briefcase

on: workflow_dispatch

jobs:
    # See: https://briefcase.readthedocs.io/en/stable/how-to/ci.html
    test_briefcase_android:
        name: "Build Briefcase Tests (Android)"
        runs-on: ubuntu-24.04
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Python
              uses: actions/setup-python@v4
              with:
                python-version: "3.13"

            - name: Install Briefcase
              run: |
                python -m pip install -U pip setuptools wheel
                python -m pip install briefcase==0.3.23 
                python -m pip install bumble==0.0.212 uvicorn==0.35.0 fastapi==0.115.14

            - name: Install dependencies
              run: pip install git+https://github.com/timrid/briefcase.git@feature/adb-forward-reverse-port-option

            - name: Install ADB
              run: sudo apt-get update && sudo apt-get install -y android-tools-adb

            - name: Setup Environment
              run: |
                # Use GitHub's preinstalled JDK 17 for Android builds
                echo JAVA_HOME="${JAVA_HOME_17_X64:-$JAVA_HOME_17_arm64}" | tee -a ${GITHUB_ENV}
                # Enable KVM permissions for the emulator
                echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
                  | sudo tee /etc/udev/rules.d/99-kvm4all.rules
                sudo udevadm control --reload-rules
                sudo udevadm trigger --name-match=kvm

            - name: Start Emulator Controller FastAPI-Server
              working-directory: ./examples/briefcase
              run: |
                nohup python emulator_controller_server.py > server.log 2>&1 &
                tail -f server.log &
                sleep 5

            - name: Run App
              working-directory: ./examples/briefcase
              run: |
                python emulator_controller_server.py &
                briefcase run \
                  Android \
                  Gradle \
                  --test --no-input --log \
                  --device '{"avd":"beePhone"}' \
                  --shutdown-on-exit \
                  --Xemulator=-no-window \
                  --Xemulator=-no-snapshot \
                  --Xemulator=-no-audio \
                  --Xemulator=-no-boot-anim \
                  --reverse-port 8000
