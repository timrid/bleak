name: Build and Test Briefcase

on: workflow_dispatch

jobs:
    # See: https://briefcase.readthedocs.io/en/stable/how-to/ci.html
    test_briefcase_android:
        name: "Build Briefcase Tests (Android)"
        runs-on: ubuntu-24.04
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Install the latest version of uv
              uses: astral-sh/setup-uv@v6
              with:
                version: "latest"
                activate-environment: true

            - name: Install Briefcase
              run: |
                uv pip install git+https://github.com/timrid/briefcase.git@feature/adb-forward-reverse-port-option

            - name: Setup Environment
              run: |
                # Use GitHub's preinstalled JDK 17 for Android builds
                echo JAVA_HOME="${JAVA_HOME_17_X64:-$JAVA_HOME_17_arm64}" | tee -a ${GITHUB_ENV}
                # Enable KVM permissions for the emulator
                echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
                  | sudo tee /etc/udev/rules.d/99-kvm4all.rules
                sudo udevadm control --reload-rules
                sudo udevadm trigger --name-match=kvm

            - name: Start Emulator Controller FastAPI-Server
              working-directory: ./examples/briefcase
              env:
                ADB_PATH: ~/.cache/briefcase/tools/android_sdk/platform-tools
              run: |
                nohup uv run emulator_controller_server.py > server.log 2>&1 &
                tail -f server.log &
                sleep 5

            - name: Run App
              working-directory: ./examples/briefcase
              run: |
                briefcase run \
                  Android \
                  Gradle \
                  --test --no-input --log \
                  --device '{"avd":"beePhone"}' \
                  --shutdown-on-exit \
                  --Xemulator=-no-window \
                  --Xemulator=-no-snapshot \
                  --Xemulator=-no-audio \
                  --Xemulator=-no-boot-anim \
                  --reverse-port 8000
