[project]
name = "bleak"
version = "3.0.1"
description = "Bluetooth Low Energy platform Agnostic Klient"
authors = [{ name = "Henrik Blidh", email = "henrik.blidh@nedomkull.com" }]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.rst"
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: AsyncIO",
    "Operating System :: Microsoft :: Windows :: Windows 10",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: Android",
]
dependencies = [
    "async-timeout>=3.0.0; python_version<'3.11'",
    "typing-extensions>=4.7.0; python_version<'3.12'",
    "pyobjc-core>=10.3; platform_system=='Darwin'",
    "pyobjc-framework-CoreBluetooth>=10.3; platform_system=='Darwin'",
    "pyobjc-framework-libdispatch>=10.3; platform_system=='Darwin'",
    "winrt-runtime>=3.1; platform_system=='Windows'",
    "winrt-Windows.Devices.Bluetooth>=3.1; platform_system=='Windows'",
    "winrt-Windows.Devices.Bluetooth.Advertisement>=3.1; platform_system=='Windows'",
    "winrt-Windows.Devices.Bluetooth.GenericAttributeProfile>=3.1; platform_system=='Windows'",
    "winrt-Windows.Devices.Enumeration>=3.1; platform_system=='Windows'",
    "winrt-Windows.Devices.Radios>=3.1; platform_system=='Windows'",
    "winrt-Windows.Foundation>=3.1; platform_system=='Windows'",
    "winrt-Windows.Foundation.Collections>=3.1; platform_system=='Windows'",
    "winrt-Windows.Storage.Streams>=3.1; platform_system=='Windows'",
    "dbus-fast>=1.83.0; platform_system=='Linux'",
]

[project.urls]
Homepage = "https://github.com/hbldh/bleak"
Documentation = "https://bleak.readthedocs.io"
Changelog = "https://github.com/hbldh/bleak/blob/develop/CHANGELOG.rst"
Support = "https://github.com/hbldh/bleak/discussions"
Issues = "https://github.com/hbldh/bleak/issues"

[project.optional-dependencies]
pythonista = ["bleak-pythonista>=0.1.1"]

[dependency-groups]
docs = [
    "Sphinx>=8.2.3; python_version>='3.11'",
    "sphinx-rtd-theme>=3.0.2; python_version>='3.11'",
]
lint = [
    "black>=24.3,<25.0",
    "flake8>=7.1.1,<8.0.0",
    "isort>=5.13.2,<6.0.0",
]
test = [
    "pytest>=8.2.1,<9.0.0",
    "pytest-asyncio>=1.2.0,<2.0.0",
    "pytest-cov>=7.0.0,<8.0.0",
    "pyserial >= 3.5", # needed for bumble
    # "bumble==0.0.226",
    "bumble @ git+https://github.com/zxzxwu/bumble.git@dependency",
]
dev = [
    # wait for https://github.com/nat-n/poethepoet/pull/375 to be merged and released
    "poethepoet @ git+https://github.com/timrid/poethepoet.git@feature/pass-free-args-to-subtasks",
    { include-group = "docs" },
    { include-group = "lint" },
    { include-group = "test" },
]

[build-system]
requires = ["uv_build>=0.10.9,<0.11.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "bleak"
module-root = ""

[tool.isort]
profile = "black"
py_version=310
src_paths = ["bleak", "examples", "tests"]
extend_skip = [".buildozer", "docs"]

[tool.mypy]
python_version = "3.10"
disable_error_code = ["import-not-found"]
exclude = "(.venv|kivy|recipes)/"
mypy_path = "typings"
packages = ["bleak", "tests", "examples"]

[tool.pyright]
typeCheckingMode = "strict"
exclude = ["**/.venv/**", "**/kivy/**", "**/recipes/**", "**/.venvs/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    "error",
    # There is an issue with coverage binary extensions on Python 3.10 on Linux.
    # Not a big deal, just reduces performance a bit.
    '''ignore:Couldn't import C tracer:coverage.exceptions.CoverageWarning''',
]

addopts = """
--cov=bleak
--cov-branch
--cov-report html
"""



[tool.poe.executor]
type = "uv"
isolated = true

[tool.poe.tasks.test-py310]
help = "Run tests using Python 3.10"
cmd = "pytest tests -v --import-mode importlib"
executor = { python = "3.10", group = "test" }

[tool.poe.tasks.test-py311]
help = "Run tests using Python 3.11"
cmd = "pytest tests -v --import-mode importlib"
executor = { python = "3.11", group = "test" }

[tool.poe.tasks.test-py312]
help = "Run tests using Python 3.12"
cmd = "pytest tests -v --import-mode importlib"
executor = { python = "3.12", group = "test" }

[tool.poe.tasks.test-py313]
help = "Run tests using Python 3.13"
cmd = "pytest tests -v --import-mode importlib"
executor = { python = "3.13", group = "test" }

[tool.poe.tasks.test-py314]
help = "Run tests using Python 3.14"
cmd = "pytest tests -v --import-mode importlib"
executor = { python = "3.14", group = "test" }

[tool.poe.tasks.test-all]
help = "Run tests using all supported Python versions"
sequence = [
    "test-py310",
    "test-py311",
    "test-py312",
    "test-py313",
    "test-py314",
]

[tool.poe.tasks.typecheck-old]
help = "Run type checkers (mypy, pyright)"

# We want always the latest version of pyright and mypy, to catch
# any breakage as soon as we can. That is why they are not dev
# dependencies in the pyproject.toml, because that would lock them to
# a specific version. Instead we install the latest version as tool.
sequence = [
    { cmd = "mypy", executor = { with = "mypy" } },
    { cmd = "pyright", executor = { with = "pyright" } },
]

[tool.poe.tasks.typecheck-generic]
sequence = [
    # Create a fresh venv for type checking
    { cmd = "uv venv ${venv_path} --clear --python ${python_version}", executor = "simple" },
    
    # Install all dependencies for the selected platform in the venv
    { cmd = "uv sync --active --python-platform ${uv_python_platform}", env = { VIRTUAL_ENV = "${venv_path}" }, executor = "simple" },
    
    # The created venv has platform-specific dependencies that may not be runnable on the current
    # platform, so we install mypy and in an isolated venv but point to the created venv.
    { cmd = "mypy --python-executable ${venv_path}/bin/python --platform ${mypy_sys_platform}", executor = { with = "mypy"} },
    { cmd = "pyright --pythonpath ${venv_path}/bin/python --pythonplatform ${pyright_pythonplatform}", executor = { with = "pyright"} },
]
args = [
    { name = "python_version", positional = true },
    { name = "venv_path", positional = true },
    { name = "uv_python_platform", positional = true },
    { name = "mypy_sys_platform", positional = true },
    { name = "pyright_pythonplatform", positional = true },
]

[tool.poe.tasks.typecheck-windows]
sequence = [
    "typecheck-generic 3.10 .venvs/.venv-windows-310 windows windows Windows",
    "typecheck-generic 3.11 .venvs/.venv-windows-311 windows windows Windows",
    "typecheck-generic 3.12 .venvs/.venv-windows-312 windows windows Windows",
    "typecheck-generic 3.13 .venvs/.venv-windows-313 windows windows Windows",
    "typecheck-generic 3.14 .venvs/.venv-windows-314 windows windows Windows",
]

[tool.poe.tasks.typecheck-linux]
sequence = [
    "typecheck-generic 3.10 .venvs/.venv-linux-310 linux linux Linux",
    "typecheck-generic 3.11 .venvs/.venv-linux-311 linux linux Linux",
    "typecheck-generic 3.12 .venvs/.venv-linux-312 linux linux Linux",
    "typecheck-generic 3.13 .venvs/.venv-linux-313 linux linux Linux",
    "typecheck-generic 3.14 .venvs/.venv-linux-314 linux linux Linux",
]

[tool.poe.tasks.typecheck-macos]
sequence = [
    "typecheck-generic 3.10 .venvs/.venv-macos-310 macos macos Darwin",
    "typecheck-generic 3.11 .venvs/.venv-macos-311 macos macos Darwin",
    "typecheck-generic 3.12 .venvs/.venv-macos-312 macos macos Darwin",
    "typecheck-generic 3.13 .venvs/.venv-macos-313 macos macos Darwin",
    "typecheck-generic 3.14 .venvs/.venv-macos-314 macos macos Darwin",
]

[tool.poe.tasks.typecheck]
sequence = [
    "typecheck-windows",
    "typecheck-linux",
    "typecheck-macos",
]


[tool.poe.tasks.lint]
help = "Run code linters (isort, black, flake8)"
sequence = [
    { cmd = "isort . docs ${checkonly:+--check --diff}", executor = { group = "lint" } },
    { cmd = "black . ${checkonly:+--check --diff}", executor = { group = "lint" } },
    { cmd = "flake8 . --count --show-source --statistics", executor = { group = "lint" } },
]
args = [{ name = "checkonly", type = "boolean" }]
executor = { group = "lint" }

[tool.poe.tasks.docs]
help = "Build the documentation"
cmd = "sphinx-build -b html -W -d docs/_build/doctrees docs docs/_build/html"
executor = { python = "3.11", group = "docs" }
